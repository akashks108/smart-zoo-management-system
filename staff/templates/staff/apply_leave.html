{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <div class="page-header">

        <div>
            <a href="{% url 'my_profile' %}" class="add-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Profile
            </a>

            <h2 style="margin-top: 20px;">Apply for Leave</h2>
            <p>Submit a leave request to the administrator</p>
        </div>

    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Leave Date</label>
            <input type="date" name="leave_date" required>
        </div>

        <div class="form-group">
            <label>Reason</label>
            <textarea name="reason" rows="5" required></textarea>
        </div>

        <button type="submit" class="save-btn">
            <i class="fa-solid fa-paper-plane"></i>
            Submit Leave Request
        </button>

    </form>

</div>

{% endblock %}
