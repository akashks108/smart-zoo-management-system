{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Delete Staff</h2>

    <p>Are you sure you want to delete this staff member?</p>

    <br>

    <h3>{{ staff.user.get_full_name }}</h3>

    <p>
        <strong>Username:</strong> {{ staff.user.username }}
    </p>

    <p>
        <strong>Designation:</strong> {{ staff.designation }}
    </p>

    <p>
        <strong>Department:</strong> {{ staff.department }}
    </p>

    <br>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Delete Staff
        </button>

        <a href="{% url 'staff_list' %}" class="edit-btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
