{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Delete Animal</h2>

    <p>Are you sure you want to delete this animal?</p>

    <br>

    <h3>{{ animal.name }}</h3>

    {% if animal.image %}
        <img src="{{ animal.image.url }}" width="250">
    {% endif %}

    <br><br>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Delete Animal
        </button>

        <a href="{% url 'animal_list' %}" class="edit-btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
