{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Add Health Record - {{ animal.name }}</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Diagnosis</label>
            {{ form.diagnosis }}
        </div>

        <div class="form-group">
            <label>Treatment</label>
            {{ form.treatment }}
        </div>

        <div class="form-group">
            <label>Check-up Date</label>
            {{ form.checkup_date }}
        </div>

        <div class="form-group">
            <label>Veterinarian</label>
            {{ form.veterinarian }}
        </div>

        <div class="form-group">
            <label>Remarks</label>
            {{ form.remarks }}
        </div>

        <button type="submit" class="save-btn">
            Save Health Record
        </button>

    </form>

</div>

{% endblock %}
