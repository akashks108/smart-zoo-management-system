{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h2>Edit Feeding Schedule - {{ animal.name }}</h2>
</div>

<div class="form-container">

    <p>
        <strong>Animal:</strong> {{ animal.name }}
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div style="margin-top: 20px;">

            <button type="submit"
                    class="save-btn">
                <i class="fa-solid fa-save"></i>
                Update Feeding Schedule
            </button>

            <a href="{% url 'feeding_schedule_list' animal.id %}"
               class="add-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
